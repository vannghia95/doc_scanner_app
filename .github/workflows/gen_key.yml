name: Generate Keystore Base64

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate and Print Base64 Keystore
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass DocScan2026 -keypass DocScan2026 -dname "CN=Vo Van Nghia, OU=VNU, O=VNU, L=Hanoi, S=Hanoi, C=VN"
          echo "=== COPY CHUOI BEN DUOI NAY ==="
          base64 -w 0 release.jks
          echo ""
          echo "=== KET THUC CHUOI ==="