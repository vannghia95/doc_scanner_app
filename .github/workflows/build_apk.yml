name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Flutter Project & Build APK
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --project-name doc_scanner_app --org vn.edu.vnu .
          flutter pub add cunning_document_scanner google_mlkit_text_recognition flutter_image_compress pdf share_plus path_provider
          cp ../lib/main.dart lib/main.dart
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocScanner-Pro-Android
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk