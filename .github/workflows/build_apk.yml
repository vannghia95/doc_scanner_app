name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Restore or Create Persistent Android Keystore
        uses: actions/cache@v4
        with:
          path: persistent_keystore/release.jks
          key: vnu-doc-scanner-release-keystore-v1

      - name: Ensure Keystore Exists
        run: |
          mkdir -p persistent_keystore
          if [ ! -f persistent_keystore/release.jks ]; then
            keytool -genkey -v -keystore persistent_keystore/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass DocScan2026 -keypass DocScan2026 -dname "CN=Vo Van Nghia, OU=VNU, O=VNU, L=Hanoi, S=Hanoi, C=VN"
          fi

      - name: Initialize Flutter Project & Build Signed APK
        run: |
          mkdir temp_app && cd temp_app
          flutter create --project-name doc_scanner_app --org vn.edu.vnu .
          flutter pub add cunning_document_scanner google_mlkit_text_recognition flutter_image_compress image http package_info_plus open_filex pdf share_plus path_provider
          cp ../lib/main.dart lib/main.dart
          cp ../persistent_keystore/release.jks android/app/release.jks

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VER=${GITHUB_REF#refs/tags/v}
            sed -i "s/^version: .*/version: ${TAG_VER}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
          else
            sed -i "s/^version: .*/version: 1.0.${GITHUB_RUN_NUMBER}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
          fi

          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle*
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle*

          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          -dontwarn com.google.android.libraries.vision.**
          EOF

          # Chèn cấu hình signingConfigs trực tiếp vào file build.gradle.kts gốc của Flutter
          python3 -c '
          with open("android/app/build.gradle.kts", "r") as f:
              content = f.read()

          signing_block = """
              signingConfigs {
                  create("release") {
                      keyAlias = "upload"
                      keyPassword = "DocScan2026"
                      storeFile = file("release.jks")
                      storePassword = "DocScan2026"
                  }
              }
          """
          content = content.replace("buildTypes {", signing_block + "\n    buildTypes {")
          content = content.replace("signingConfigs.getByName(\"debug\")", "signingConfigs.getByName(\"release\")")
          content = content.replace("release {", "release {\n            proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")")

          with open("android/app/build.gradle.kts", "w") as f:
              f.write(content)
          '

          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: DocScanner-Pro-Android
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: temp_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true