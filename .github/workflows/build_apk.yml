name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Flutter Project & Build APK
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --project-name doc_scanner_app --org vn.edu.vnu .
          flutter pub add cunning_document_scanner google_mlkit_text_recognition flutter_image_compress image http pdf share_plus path_provider
          cp ../lib/main.dart lib/main.dart
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle*
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle*

          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          -dontwarn com.google.android.libraries.vision.**
          EOF

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/release {/release {\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")/' android/app/build.gradle.kts
          else
            sed -i 's/release {/release {\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"/' android/app/build.gradle
          fi

          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocScanner-Pro-Android
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk